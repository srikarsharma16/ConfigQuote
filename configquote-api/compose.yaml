
services:
  postgres:
    image: postgres:17
    container_name: configquote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: configquote_db
      POSTGRES_USER: configquote_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U configquote_user -d configquote_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
